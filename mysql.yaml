apiVersion: apps/v1
kind: Deployment
metadata:
    name: mysql-deployment
spec: 
  replicas: 1 
  selector: 
    matchLabels:
      app: mysql
  template: 
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - image:  mysql:8.0
          name: "mysql"
          ports:
          - containerPort: 3306
          env:
            - name:  MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: root-password
            - name:  MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: database-name
            - name:  MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: user-name
            - name:  MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: user-password
--- 
kind: Service
apiVersion: v1
metadata:
  name:   mysql-service
spec:
  selector:
    app:  mysql
  ports:
  - port:  3306
    targetPort:  3306