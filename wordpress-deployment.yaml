apiVersion: apps/v1
kind: Deployment
metadata:
  name:  wordpress-deployment
spec:
  replicas: 3 
  selector:
    matchLabels: 
      app: wordpress
  template: 
      metadata:
        labels:
          app: wordpress
      spec: 
        containers:
          -  name:  wordpress
             image:  wordpress:latest
             ports:
             - containerPort: 80 
             env:
              - name:  WORDPRESS_DB_HOST
                value:  "mysql-service"
              - name: WORDPRESS_DB_USER
                valueFrom: 
                  secretKeyRef:
                    name:  mysql-secret
                    key: user-name
              - name: WORDPRESS_DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: mysql-secret
                    key: user-password
              - name: WORDPRESS_DB_NAME
                valueFrom:
                  secretKeyRef:
                    name: mysql-secret
                    key: database-name

---
kind: Service
apiVersion: v1
metadata:
  name:  wordpress-service
spec:
  type: NodePort
  selector:
    app: wordpress
  ports:
  - port:  80
    targetPort:  80